name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install --no-deps ./vendor/BilibiliCrawler
      - name: 单元/集成测试（离线，不触 B 站接口）
        run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（含容器内烟雾测试）
        run: |
          docker build -t bilicom-web:ci .
          docker run -d --name smoke -p 8765:8765 bilicom-web:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8765/api/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/api/health
          docker rm -f smoke
